name: Sync BaiduPan unlock upstream

# 每日北京时间 07:37（UTC 23:37）；调度可能延迟。
# 配置来自原 JS 内嵌规则；无变化不提交，下载/验证失败保留旧版。
on:
  schedule:
    - cron: "37 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/sync_bdpan.py
      - .github/scripts/test_sync_bdpan.py
      - .github/scripts/test_bdpan_runtime.cjs
      - .github/workflows/sync-bdpan-unlock.yml

permissions:
  contents: write

concurrency:
  group: sync-bdpan-unlock-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node for native Surge behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test full BaiduPan converter and failure protection
        run: python3 .github/scripts/test_sync_bdpan.py
      - name: Download full upstream, test behavior, generate module
        run: python3 .github/scripts/sync_bdpan.py --kind unlock
      - name: Publish only this module and its scripts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          git add -- Surge/Module/bdpan.unlock.sgmodule Surge/JavaScript/BaiduPan/bdpan.unlock.js Surge/JavaScript/BaiduPan/bdpan.unlock.surge.js
          if git diff --cached --quiet; then
            echo "No upstream changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync BaiduPan unlock module and scripts from upstream"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          trap 'unset auth GH_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0' EXIT
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
          done
          echo "Publish failed after three attempts" >&2
          exit 1
