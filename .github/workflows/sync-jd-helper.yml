name: Sync JD Helper upstream

# 每日北京时间 08:07（UTC 00:07）；GitHub 调度可能延迟。
on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/sync_jd_helper.py
      - .github/scripts/test_sync_jd_helper.py
      - .github/workflows/sync-jd-helper.yml

permissions:
  contents: write

concurrency:
  group: sync-jd-helper-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test exact mirror and rollback
        run: python3 .github/scripts/test_sync_jd_helper.py
      - name: Synchronize exact module and JS dependency
        run: python3 .github/scripts/sync_jd_helper.py
      - name: Publish JD Helper files only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          git add -- Surge/Module/JD_Helper.sgmodule Surge/JavaScript/JD_Helper/jd_price1.js
          if git diff --cached --quiet; then
            echo "No upstream changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync JD Helper module and script"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          trap 'unset auth GH_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0' EXIT
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
          done
          exit 1
